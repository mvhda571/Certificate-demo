[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  # AI Tutor konspekt qidiruvi uchun .md fayllar funksiya bilan birga yuklanadi.
  included_files = ["src/data/konspekt/**"]

# /api/* — faqat funksiyalar (netlify/functions/*, config.path). Topilmagan API yo'li SPA'ga ketmasin.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# SPA: qolgan barcha yo'llar index.html'ga (funksiyalar redirect'lardan oldin tekshiriladi).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
